[workspace]
resolver = "2"
members = [
    "crates/rustpad_zip",
    "crates/doc_model",
    "crates/docx_io",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
authors = ["Nour Yahyaoui <nourryahyaoui@gmail.com>"]
license = "MIT"
repository = "https://github.com/Nour-yahyaoui/word"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
